<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <!-- Header containing the website logo and page title -->
    <header>
        <img class="Logo" src="Images/LOGO2-removebg-preview.png" alt="Logo">
        <h1>Home</h1>
    </header>

    <!-- Main content of the homepage -->
    <main>

        <!-- Welcome message for the guest user -->
        <h1 class="welkom">Welkom, gast</h1>

        <!-- Section containing the introduction and link to the field explorer -->
         <img class="logo" src="Images/Vector.png" alt="">
        <section class="BC">
            <a href="veldverkenner.html">
                <button class="veldbutton"><strong>Ontdenk het veld.</strong></button>
            </a>
        </section>

        <br>

        <!-- Image of the flower field map -->
         <a href="veldverkenner.html">
        <div class="box">
            <img class="Map" src="Images/Bloemenveld_kaart.svg" alt="Kaart van het bloemenveld">
        </div></a>

        <!-- Heading for the field news section -->
        <section class="veld-nieuws">
            <img class="icon2" src="Images/veldverkenner1.png.png" alt="">
            <p>Veld nieuws</p>
        </section>

        <!-- Carousel displaying different locations and spots -->
        <section class="carousel">

            <!-- Track containing the carousel items -->
            <div class="carousel-track">

                <!-- Group of cards linking to different locations -->
                <div class="group">

                    <!-- Link to Coffeecompany -->
                    <a href="https://coffeecompany.nl/locations/wibautstraat-7/">
                        <div class="card">
                            <img class="spots" src="Images/Frame68.svg" alt="image of a coffee spot">
                        </div>
                    </a>

                    <!-- Link to campus relaxation spots -->
                    <a href="https://hvana.nl/nieuws/dit-zijn-de-plekken-om-te-chillen-op-de-campus">
                        <div class="card">
                            <img class="spots" src="Images/Frame79.svg" alt="image of a business building">
                        </div>
                    </a>

                    <!-- Link to the Wibauthuis library -->
                    <a href="https://www.hva.nl/locaties/wibauthuis-bibliotheek">
                        <div class="card">
                            <img class="spots" src="Images/Frame81.svg" alt="image of a library">
                        </div>
                    </a>

                    <!-- Link to the Benno Premselahuis -->
                    <a href="https://www.hva.nl/locaties/benno-premselahuis">
                        <div class="card">
                            <img class="spots" src="Images/Frame82.svg" alt="image of the BPH house">
                        </div>
                    </a>

                </div>
            </div>
        </section>

    </main>

    <!-- Footer containing the main navigation links -->
    <footer class="navfooter">

        <!-- Navigation link to the homepage -->
        <a href="index.html" class="nav item">
            <img class="NF" src="Images/Home.PNG" alt="Home">
        </a>

        <!-- Navigation link to the field explorer -->
        <a href="veldverkenner.html" class="nav item">
            <img class="NG" src="Images/Veldverkenner.PNG" alt="Veldverkenner">
        </a>

        <!-- Navigation link to the news page -->
        <a href="" class="nav item">
            <img class="NF" src="Images/news.PNG" alt="Nieuws">
        </a>

        <!-- Navigation link to the collection page -->
        <a href="collectie.html" class="nav item">
            <img class="NF" src="Images/collectie.PNG" alt="Collectie">
        </a>

    </footer>

</body>
</html>
