<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veldverkenner</title>
    <link rel="stylesheet" href="CSS/styles2.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
</head>
<body>

    <!-- Header containing the website logo and guest icon -->
    <header>

        <img class="Logo" src="Images/LOGO2-removebg-preview.png" alt="Logo">
        <img class="Gast" src="Images/Gast.png" alt="Gast">

    </header>

    <!-- Main content of the field explorer page -->
    <main>

        <!-- Icon representing the field explorer -->
        <img class="VeldIcoon" src="Images/Vector.png" alt="">

        <!-- Introduction to the field explorer -->
        <section class="introkaart">
            <h1>Veldverkenner</h1>
            <p>Scroll, klik en ontdenk!</p>
        </section>

        <!-- Interactive OpenStreetMap displaying Park Frankendael -->
        <div id ="map"></div>

        <!-- Buttons that open the zones and explanation popups -->
        <div class="map-buttons">

            <!-- Button to display the map zones -->
            <button class="legenda1" onclick="showPopup('zones-dialog')">
                <img class="legenda" src="Images/legenda.png" alt="Zones">
            </button>

            <!-- Button to display the map explanation -->
            <button class="legenda1" onclick="showPopup('uitleg-dialog')">
                <img class="legenda" src="Images/legenda2.png" alt="Uitleg">
            </button>

        </div>

        <!-- Dialog displaying information about the different zones -->
        <dialog id="zones-dialog">
            <h2>Zones</h2>
            <img src="Images/Frame294.svg" alt="Legenda">
            <button onclick="closePopup('zones-dialog')">Terug</button>
        </dialog>

        <!-- Dialog explaining how to use the field explorer -->
        <dialog id="uitleg-dialog">
            <h2>Uitleg</h2>
            <img src="Images/Frame299.svg" alt="Legenda">

            <button onclick="closePopup('uitleg-dialog')">Terug</button>
        </dialog>

    </main>

    <!-- Horizontal divider between the main content and footer -->
    <hr>

    <!-- Footer containing the main navigation links -->
    <footer class="navfooter">

        <!-- Navigation link to the homepage -->
        <a href="index.html" class="nav item">
            <img class="NF" src="Images/Home.PNG" alt="Home">
        </a>

        <!-- Navigation link to the field explorer -->
        <a href="veldverkenner.html" class="nav item">
            <img class="NG" src="Images/Veldverkenner.PNG" alt="Veldverkenner">
        </a>

        <!-- Navigation link to the news page -->
        <a href="" class="nav item">
            <img class="NF" src="Images/news.PNG" alt="Nieuws">
        </a>

        <!-- Navigation link to the collection page -->
        <a href="collectie.html" class="nav item">
            <img class="NF" src="Images/collectie.PNG" alt="Collectie">
        </a>

    </footer>

    <!-- JavaScript file controlling the popup functionality -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    

</body>
</html>
