<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veldverkenner</title>
    <link rel="stylesheet" href="CSS/styles2.css">
</head>
<body>
    <header>

        <img class="Logo"  src="Images/LOGO2-removebg-preview.png">
        <img class="Gast" src="Images/Gast.png">

    </header>
    <main>
        <img class="VeldIcoon" src="Images/Vector.png">

        <div class="introkaart">
            <h1>Veldverkenner</h1>
            <p>Scroll, klik en ontdenk!</p>
        </div>

        <div class="kaart-container">
            <iframe title ="OpenStreetMap - Park Frankendael"
            src="https://www.openstreetmap.org/export/embed.html?bbox=4.9275%2C52.3505%2C4.9335%2C52.3535&layer=mapnik&marker=52.351960%2C4.930549"
            loading="lazy" allowfullscreen>
            </iframe>
        </div>
            
<div class="map-buttons">

    <button class="legenda1" onclick="showPopup('zones-dialog')">
        <img class="legenda" src="Images/legenda.png" alt="Zones">
    </button>

    <button class="legenda1" onclick="showPopup('uitleg-dialog')">
        <img class="legenda" src="Images/legenda2.png" alt="Uitleg">
    </button>

</div>

<dialog id="zones-dialog">
    <h2>Zones</h2>
    <img src="Images/Frame294.svg" alt="Legenda">
    <button onclick="closePopup('zones-dialog')">Terug</button>
</dialog>

<dialog id="uitleg-dialog">
    <h2>Uitleg</h2>
     <img src= "Images/Frame299.svg" alt="Legenda">
   
    <button onclick="closePopup('uitleg-dialog')">Terug</button>
</dialog>

    </main>

        </a>

        </a>

        <a href="collectie.html" class="nav item">
            <img class="NF" src="Images/collectie.PNG">
        </a>

    </footer>
    <script src="script.js"></script>
</body>
</html>
